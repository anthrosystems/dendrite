name: Bug report
description: Report a reproducible problem in Dendrite.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Dendrite.

        **Do not use this form for security vulnerabilities.**
        Please use GitHub's private security advisory reporting instead.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
      placeholder: A concise description of the problem.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that reproduces the issue.
      placeholder: |
        1. Start dendrited with ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Dendrite version or commit
      placeholder: v0.1.0-alpha.1 or commit SHA
    validations:
      required: true

  - type: input
    id: distro
    attributes:
      label: Linux distribution
      placeholder: Ubuntu 24.04, Fedora 42, etc.
    validations:
      required: true

  - type: input
    id: kernel
    attributes:
      label: Kernel version
      placeholder: Output of uname -r

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets, credentials, personal data, and unrelated host information.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that may help reproduce or diagnose the issue.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before opening this report.
          required: true
        - label: This report does not contain a security vulnerability.
          required: true
