[package]
name = "dendrite-magi"
version = "0.1.1"
edition = "2024"
description = "Dendrite's MAGI evaluation process (Host/User/Environment quorum voters)"
license = "Apache-2.0"
repository = "https://github.com/anthrosystems/dendrite"

[dependencies]
dendrite-protocol = { path = "../dendrite-protocol" }
rmcp = { version = "3.4.1", features = ["client", "transport-child-process"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util"] }
